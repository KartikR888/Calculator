<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f2f4f7;
    }

    .calculator {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 300px;
    }

    #display {
      width: 100%;
      height: 55px;
      font-size: 26px;
      text-align: right;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #f9f9f9;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 50px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #e4e6eb;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #d0d2d7;
    }

    .operator {
      background-color: #ff9f0a;
      color: white;
    }

    .operator:hover {
      background-color: #e08c07;
    }

    .clear {
      background-color: #ff3b30;
      color: white;
    }

    .clear:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <!-- Screen -->
    <input type="text" id="display" value="" readonly>

    <!-- Buttons -->
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendCharacter('/')">/</button>
      <button class="operator" onclick="appendCharacter('*')">×</button>

      <button onclick="appendCharacter('7')">7</button>
      <button onclick="appendCharacter('8')">8</button>
      <button onclick="appendCharacter('9')">9</button>
      <button class="operator" onclick="appendCharacter('-')">-</button>

      <button onclick="appendCharacter('4')">4</button>
      <button onclick="appendCharacter('5')">5</button>
      <button onclick="appendCharacter('6')">6</button>
      <button class="operator" onclick="appendCharacter('+')">+</button>

      <button onclick="appendCharacter('1')">1</button>
      <button onclick="appendCharacter('2')">2</button>
      <button onclick="appendCharacter('3')">3</button>
      <button class="operator" onclick="calculate()">=</button>

      <button onclick="appendCharacter('0')" style="grid-column: span 2;">0</button>
      <button onclick="appendCharacter('.')">.</button>
      <button>✨</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    // Add a number or operator to the screen
    function appendCharacter(char) {
      display.value += char;
    }

    // Clear the whole display
    function clearDisplay() {
      display.value = "";
    }

    // Remove the last typed character
    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    // Calculate the math expression
    function calculate() {
      try {
        if (display.value.trim() !== "") {
          display.value = Function('"use strict";return (' + display.value + ')')();
        }
      } catch (error) {
        display.value = "Error";
      }
    }
  </script>

</body>
</html>
